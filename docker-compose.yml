services:
  mysql:
    image: mysql:8.4
    container_name: wemby-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wemby
      MYSQL_USER: wemby
      MYSQL_PASSWORD: wemby
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: wemby-phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "8081:80"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: wemby-backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      JWT_SECRET: wemby-secret-change-me
      API_ORIGIN: http://localhost:4173
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: wemby
      MYSQL_USER: wemby
      MYSQL_PASSWORD: wemby
    ports:
      - "8080:8080"
      - "50051:50051"

  frontend:
    build:
      context: .
      dockerfile: react-app/Dockerfile
    container_name: wemby-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:80"

volumes:
  mysql_data: