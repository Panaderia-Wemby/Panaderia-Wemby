x-app-env: &app-env
  APP_NAME: "Panaderia-Wemby"
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: "http://localhost"
  APP_KEY: "base64:+i8mPNFyWvBKsJp9LxKzQ0m3W2V5X8Y1Z4A7B0C3D6E="
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: sd_app
  DB_USERNAME: sdapp
  DB_PASSWORD: sdapppass
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_HOST: redis
  REDIS_PASSWORD: redispass
  REDIS_PORT: 6379
  GRPC_HOST: "0.0.0.0"
  GRPC_PORT: "50051"

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  ports:
    - "9000"
    - "50051"
  depends_on:
    mysql:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - sd_network
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "php", "artisan", "about", "--no-ansi"]
    interval: 30s
    timeout: 20s
    retries: 3

services:
  # ============================================================
  # NODO 1 - APP + PHP-FPM
  # ============================================================
  app1:
    <<: *app-base
    container_name: app-nodo1
    environment:
      <<: *app-env
      NODE_ID: nodo1
      NODE_NAME: "Nodo 1"
      GRPC_NODO1: app1:50051
      GRPC_NODO2: app2:50051
      GRPC_NODO3: app3:50051
    ports:
      - "9001:9000"
      - "50051:50051"

  app2:
    <<: *app-base
    container_name: app-nodo2
    environment:
      <<: *app-env
      NODE_ID: nodo2
      NODE_NAME: "Nodo 2"
      GRPC_NODO1: app1:50051
      GRPC_NODO2: app2:50051
      GRPC_NODO3: app3:50051
    ports:
      - "9002:9000"
      - "50052:50051"

  app3:
    <<: *app-base
    container_name: app-nodo3
    environment:
      <<: *app-env
      NODE_ID: nodo3
      NODE_NAME: "Nodo 3"
      GRPC_NODO1: app1:50051
      GRPC_NODO2: app2:50051
      GRPC_NODO3: app3:50051
    ports:
      - "9003:9000"
      - "50053:50051"

  # ============================================================
  # NGINX - Load Balancer / Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: nginx-lb
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/laravel.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app1
      - app2
      - app3
    networks:
      - sd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # MYSQL - Base de Datos
  # ============================================================
  mysql:
    image: mariadb:10.11
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sd_app
      MYSQL_USER: sdapp
      MYSQL_PASSWORD: sdapppass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - sd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # REDIS - Cache/Session/Queue
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: redis-cache
    command: redis-server --requirepass redispass --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sd_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispass", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # PhpMyAdmin
  # ============================================================
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: sdapp
      PMA_PASSWORD: sdapppass
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql
    networks:
      - sd_network
    restart: unless-stopped

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  sd_network:
    driver: bridge
