# ============================================================
# Upstream: Balance entre instancias PHP-FPM (preparado para 3 nodos)
# ============================================================
upstream php_cluster {
    # Reemplazar con IPs reales en producción
    server app1:9000 max_fails=3 fail_timeout=20s weight=1;
    server app2:9000 max_fails=3 fail_timeout=20s weight=1;
    server app3:9000 max_fails=3 fail_timeout=20s weight=1;
    keepalive 16;
}

# ============================================================
# Server: Configuración del sitio Laravel
# ============================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name localhost _;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Headers para debug en demo
    add_header X-Node $hostname always;
    add_header X-Upstream $upstream_addr always;
    add_header X-Response-Time $request_time always;

    # Endpoint de salud para Keepalived/LB
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
        access_log off;
    }

    # Rutas principales
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento PHP
    location ~ \.php$ {
        fastcgi_pass php_cluster;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;

        # Timeouts
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 75s;
        fastcgi_send_timeout 300s;

        # Buffer
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 16k;
    }

    # gRPC
    location /grpc {
        grpc_pass grpc://php_cluster;
        error_page 502 503 504 /50x.html;
    }

    # Archivos estáticos (no pasar por PHP)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        log_not_found off;
        access_log off;
    }

    # Denegar acceso a archivos sensibles
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ /\.env {
        deny all;
    }

    # Configuración de error
    error_page 404 /index.php;

    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
